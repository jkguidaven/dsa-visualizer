<div class="container">
  <ts-toolbar>
    <ts-button
      variant="primary"
      (tsClick)="randomize()"
      [disabled]="runner.isRunning()">
      Randomize
    </ts-button>

    <ts-checkbox
      [checked]="withMaze"
      (tsChange)="withMaze = $event.detail.checked">
      With Maze
    </ts-checkbox>

    <span class="spacer"></span>

    <ts-select
      class="algorithm-select"
      [value]="currentAlgorithm"
      [disabled]="runner.isRunning()"
      (tsChange)="setAlgorithm($event.detail.value)">
      @for (algorithm of getSupportedAlgorithms(); track algorithm) {
        <option [value]="algorithm">{{ algorithm }}</option>
      }
    </ts-select>

    <div class="controls">
      <ts-button appearance="ghost" size="sm" (tsClick)="previous()" [disabled]="!canNavigateBack()">
        <ts-icon name="chevron-left"></ts-icon>
      </ts-button>

      <ts-button appearance="ghost" size="sm" (tsClick)="play()">
        <ts-icon [name]="runner.isRunning() ? 'pause' : 'play'"></ts-icon>
      </ts-button>

      <ts-button appearance="ghost" size="sm" (tsClick)="stop()" [disabled]="!runner.hasStarted()">
        <ts-icon name="square"></ts-icon>
      </ts-button>

      <ts-button appearance="ghost" size="sm" (tsClick)="next()" [disabled]="runner.isRunning()">
        <ts-icon name="chevron-right"></ts-icon>
      </ts-button>
    </div>
  </ts-toolbar>

  <app-graph-display
    class="graph-display"
    [model]="model"
    [locked]="runner.isRunning()"
    (nodeChange)="handleModelChange()">
  </app-graph-display>
</div>
