<div class="container">
  <mat-toolbar>
    <mat-slider
      [disabled]="runner.isRunning()"
      min="5"
      max="100"
      step="1"
      discrete
    >
      <input matSliderThumb [(ngModel)]="size" (valueChange)="generateModel()">
    </mat-slider>

    <button
      mat-flat-button
      color="accent"
      (click)="generateModel()"
      [disabled]="runner.isRunning()"
    >
      Randomize
    </button>

    <span class="spacer"></span>

    <div class="algorithm-select-container">
      <mat-select
        [(value)]="currentAlgorithm"
        [disabled]="runner.isRunning()"
        name="algorithm-selection"
      >
        @for (algorithm of getSupportedAlgorithms(); track algorithm) {
          <mat-option
            [value]="algorithm"
            (click)="setAlgorithm(algorithm)"
          >
            {{ algorithm }}
          </mat-option>
        }
      </mat-select>
    </div>

    <div>
      <button mat-icon-button (click)="previous()" [disabled]="!canNavigateBack()">
        <mat-icon>navigate_before</mat-icon>
      </button>

      <button mat-icon-button (click)="play()">
        <mat-icon>{{ runner.isRunning() ? 'pause' : 'play_arrow' }}</mat-icon>
      </button>

      <button mat-icon-button (click)="stop()" [disabled]="!runner.hasStarted()">
        <mat-icon>stop</mat-icon>
      </button>

      <button mat-icon-button (click)="next()" [disabled]="runner.isRunning()">
        <mat-icon>navigate_next</mat-icon>
      </button>
    </div>
  </mat-toolbar>

  <app-array-display class="array-display" [model]="model">
  </app-array-display>
</div>
