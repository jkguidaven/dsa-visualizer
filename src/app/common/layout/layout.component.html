<ts-app-layout>
  <ts-sidebar slot="sidebar" collapsible [collapsed]="collapseSidenav"
    (tsToggle)="collapseSidenav = $event.detail.collapsed">
    <app-page-sidenav [menuItems]="menuItems()"></app-page-sidenav>
  </ts-sidebar>

  <div class="main">
    <header class="page-header-row">
      <ts-page-header class="page-header" [heading]="pageTitle" [description]="pageDescription"></ts-page-header>
      <app-theme-toggle class="theme-toggle"></app-theme-toggle>
    </header>
    <div class="content-container">
      <ng-content></ng-content>
    </div>
  </div>
</ts-app-layout>
